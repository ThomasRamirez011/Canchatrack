# Mantiene al día las acciones de GitHub, las dependencias Maven/npm y la imagen base (Guías 9 y 12).
# Las acciones están fijadas por SHA completo (con el número de versión en un comentario): Dependabot actualiza ambos.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  # No se vigila la raíz: es la plantilla de Figma Make (Payload en beta fijada en bloque, sin despliegue desde GitHub).
  # El front real es /frontend (GitHub Pages).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Los tipos de Node deben seguir a la versión de Node con la que se compila (24 en frontend-pages.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
