# PostgreSQL para desarrollo local:  docker compose up -d
# Coincide con los valores por defecto de application-dev.yml.
services:
  db:
    image: postgres:16-alpine
    container_name: canchatrack-db
    environment:
      POSTGRES_DB: canchatrack
      POSTGRES_USER: canchatrack
      POSTGRES_PASSWORD: canchatrack_dev
    ports:
      - "5432:5432"
    volumes:
      - canchatrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchatrack -d canchatrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canchatrack-pgdata:
