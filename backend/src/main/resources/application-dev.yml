# Desarrollo local contra el PostgreSQL de docker-compose.yml.
# Estas credenciales son desechables y SOLO valen para el contenedor local; cualquier otro ambiente usa variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/canchatrack}
    username: ${DB_USER:canchatrack}
    password: ${DB_PASSWORD:canchatrack_dev}
  jpa:
    show-sql: false

logging:
  level:
    co.edu.unipamplona.canchatrack: DEBUG
    org.flywaydb: INFO
  pattern:
    level: "%5p [%X{correlationId:-}]"

canchatrack:
  demo:
    # Carga equipos, jugadores, cobros y partidos de ejemplo al arrancar (solo si la base aún no tiene categorías).
    enabled: ${DEMO_DATA:true}
  security:
    jwt:
      # Clave DESECHABLE, solo para desarrollo local: cualquier otro ambiente usa JWT_SECRET.
      secret: ${JWT_SECRET:DKv8YoVfp9uedaoXm7r9CRmB1vHtCdNAa3NXpuqV3C1wDf9ZRUZqqmfuOxSOWKh+}
    cors:
      # Servidores de desarrollo habituales del front (Next.js, Vite); CORS_ALLOWED_ORIGINS los reemplaza.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      # Solo desarrollo: el front de prueba se sirve desde una URL de vista previa que cambia, así que se acepta
      # cualquier origen. Es tolerable porque la autenticación es un token Bearer (no cookies).
      allow-any-origin: ${CORS_ALLOW_ANY_ORIGIN:true}
  identity:
    # En desarrollo el correo no sale (solo se registra), así que no se exige confirmarlo para iniciar sesión.
    require-verified-email: false
    mfa:
      enabled: ${MFA_ENABLED:false} # desarrollo local sin segundo factor; MFA_ENABLED=true lo activa
      # Llave DESECHABLE, solo para desarrollo local: cualquier otro ambiente usa MFA_ENCRYPTION_KEY.
      encryption-key: ${MFA_ENCRYPTION_KEY:ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1kaXNwb3M=}
    bootstrap:
      # Cuenta inicial desechable de desarrollo (solo se crea si la base no tiene usuarios).
      coordinator-email: ${BOOTSTRAP_COORDINATOR_EMAIL:coordinador@canchatrack.local}
      coordinator-name: Coordinador (desarrollo)
      coordinator-password: ${BOOTSTRAP_COORDINATOR_PASSWORD:Dev-Only-Change-Me-1}
