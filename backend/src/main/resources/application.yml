# Configuración común. Lo específico de cada ambiente vive en application-{dev,test,prod}.yml.
# Los secretos NUNCA se escriben aquí: llegan por variables de entorno (CLAUDE.md, DDS secc. 14).
spring:
  application:
    name: canchatrack-backend
  profiles:
    default: dev
  autoconfigure:
    exclude:
      # Sin usuario en memoria con contraseña generada: la autenticación es por JWT (ver canchatrack.security / identity).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gobierna Flyway; Hibernate solo verifica (DDS 7.1)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false # fechas ISO 8601 (DDS 8.1)
  mvc:
    problemdetails:
      enabled: false # los errores los construye ApiExceptionHandler (application/problem+json con code y correlationId)

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

canchatrack:
  zone-id: America/Bogota # zona horaria del club para reglas de fecha (vigencias, recordatorios)
  security:
    jwt:
      # secret: SIEMPRE por variable de entorno JWT_SECRET (Base64, >= 32 bytes); el perfil dev trae uno desechable.
      issuer: canchatrack
      access-ttl: 15m # corto a propósito: un access token no se puede revocar antes de vencer
  identity:
    bcrypt-strength: 12
    refresh-ttl: 7d
    refresh-absolute-ttl: 30d # tope de la sesión completa; no se extiende al rotar
    max-failed-attempts: 5
    lock-duration: 15m
    # bootstrap.coordinator-email / -name / -password: primera cuenta; solo se usa si no hay ninguna (ver README).
