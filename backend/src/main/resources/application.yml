# Configuración común. Lo específico de cada ambiente vive en application-{dev,test,prod}.yml.
# Los secretos NUNCA se escriben aquí: llegan por variables de entorno (CLAUDE.md, DDS secc. 14).
spring:
  application:
    name: canchatrack-backend
  profiles:
    default: dev
  autoconfigure:
    exclude:
      # Sin usuario en memoria con contraseña generada: la autenticación es por JWT (ver canchatrack.security / identity).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gobierna Flyway; Hibernate solo verifica (DDS 7.1)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false # fechas ISO 8601 (DDS 8.1)
  servlet:
    multipart:
      max-file-size: 10MB # coherente con canchatrack.files.max-size
      max-request-size: 12MB
  mvc:
    problemdetails:
      enabled: false # los errores los construye ApiExceptionHandler (application/problem+json con code y correlationId)

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

canchatrack:
  zone-id: America/Bogota # zona horaria del club para reglas de fecha (vigencias, recordatorios)
  app-url: ${APP_URL:} # dirección pública del front; se incluye como enlace en los correos de la agenda (vacía = sin enlace)
  scheduling:
    reminders:
      hours: 24,2 # horas antes de un entrenamiento o evaluación en que sale un recordatorio (RF-019); 1..168, hasta 5 valores
      match-hours: 48,2 # lo mismo para los partidos
      interval: PT5M # cada cuánto se revisan los eventos próximos
  payments:
    arrears-notices:
      interval-days: 7 # tras el primer aviso de mora, uno cada tantos días mientras el cargo siga con saldo (RF-041)
      max-notices: 8 # tope de avisos por cargo; 0 apaga los avisos
  security:
    jwt:
      # secret: SIEMPRE por variable de entorno JWT_SECRET (Base64, >= 32 bytes); el perfil dev trae uno desechable.
      issuer: canchatrack
      access-ttl: 15m # corto a propósito: un access token no se puede revocar antes de vencer
    cors:
      # Orígenes del navegador autorizados (el front). Vacío = sin CORS. Sin comodines; fuera de localhost, solo https.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  identity:
    bcrypt-strength: 12
    refresh-ttl: 7d
    refresh-absolute-ttl: 30d # tope de la sesión completa; no se extiende al rotar
    max-failed-attempts: 5
    lock-duration: 15m
    require-verified-email: true # el autorregistro de acudientes debe confirmar el correo antes de iniciar sesión
    recovery:
      reset-ttl: 30m # vigencia del enlace de restablecimiento de contraseña
      verification-ttl: 48h # vigencia del enlace de confirmación de correo
      reset-path: /reset-password # rutas del front que reciben el token (se añaden a APP_URL)
      verify-path: /verify-email
      retention: 7d # cuánto se guardan los tokens inservibles antes de la limpieza diaria
    rate-limit:
      enabled: true
      login-per-ip: 30 # inicios de sesión por IP dentro de login-window
      login-window: 15m
      register-per-ip: 10 # altas de acudientes por IP
      register-window: 1h
      recovery-per-ip: 10 # correos de recuperación o confirmación pedidos por IP
      recovery-per-email: 3 # ... y por correo (evita inundar a una víctima)
      recovery-window: 1h
      confirm-per-ip: 30 # canjes de enlaces por IP
      confirm-window: 15m
    # bootstrap.coordinator-email / -name / -password: primera cuenta; solo se usa si no hay ninguna (ver README).
  enrollment:
    consent-version: v1 # versión del texto de consentimiento que acepta el acudiente al radicar (RF-011)
  calls:
    max-exception-validity: 30d # vigencia máxima de una habilitación excepcional (RF-044)
  committee: # parámetros provisionales de la decisión del comité técnico (DP-01 pendiente)
    panel-roles: EVALUATOR,COACH,COMMITTEE # roles que pueden integrar el panel de tres evaluadores
    allow-capacity-exception: true # permite asignar a una categoría llena dejando el motivo
  files:
    directory: ./data/files # almacenamiento en disco (dev); en producción, un almacén de objetos con el mismo puerto
    max-size: 10MB
  notifications:
    sender: log # log = simulado (dev/pruebas); smtp = correo real (prod, ver application-prod.yml)
    processor:
      enabled: true
      interval: PT10S # espera entre pasadas del procesador de la cola
      batch-size: 50
      lease: 5m # arriendo de un aviso reclamado: debe superar lo que tarda un envío
    retry:
      max-attempts: 5 # intentos totales; luego el aviso queda FAILED
      base-delay: 1m # espera tras el primer fallo; crece x4 hasta max-delay
      max-delay: 6h
