    AttendanceStatus:
      type: string
      enum: [PRESENT, LATE, EXCUSED, ABSENT]
    MarkRequest:
      type: object
      properties:
        clientUuid: { type: string, format: uuid, description: Identificador generado en el dispositivo. }
        playerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        excuseAccepted: { type: boolean, default: false }
        clientRecordedAt: { type: string, format: date-time }
    SyncRequest:
      type: object
      properties:
        records: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/MarkRequest' } }
    RejectionResponse:
      type: object
