openapi: 3.1.0
info:
  title: CanchaTrack API
  version: 0.1.0
  summary: API REST de CanchaTrack (gestión de una escuela formativa de baloncesto).
  description: |
    Contrato ejecutable de la API (DDS secc. 8). **Regla del proyecto: cada endpoint se documenta aquí antes de
    implementarse** y se versiona junto con el código.

    Convenciones (DDS 8.1): JSON UTF-8, fechas ISO 8601 con zona horaria, UUID como identificador técnico,
    errores en `application/problem+json` con `code` estable y `correlationId`. Las operaciones reintentables
    exigen la cabecera `Idempotency-Key`.
servers:
  - url: /api/v1
    description: Prefijo de todas las rutas
tags:
  - name: system
    description: Estado del servicio
  - name: auth
    description: Inicio, renovación y cierre de sesión. Access token JWT corto + refresh token opaco con rotación.
  - name: users
    description: Cuentas de personal del club (solo coordinador).
  - name: guardians
    description: Autorregistro público de acudientes.
  - name: seasons
    description: Temporadas deportivas (solo coordinador).
  - name: calls
    description: Convocatorias de inscripción. Consulta de abiertas para cualquier usuario; administración solo del coordinador.
  - name: categories
    description: Categorías por rango de año de nacimiento y cupo. Las define el club (DP-01); las administra el coordinador.
  - name: committee
    description: Decisión del Comité Técnico sobre inscripciones radicadas (categoría, entrenador, panel y acta).
  - name: files
    description: Archivos de soporte (comprobantes, actas). Se suben aparte y se referencian por id.
  - name: documents
    description: Catálogo de documentos, ventanas de carga, versiones inmutables, vigencias y alertas de vencimiento (CU-13). Los documentos de salud tienen acceso restringido y auditado.
  - name: payments
    description: Tarifas, matrícula, cargos, pagos inmutables y estado de cuenta.
  - name: scheduling
    description: Escenarios y agenda de entrenamientos y evaluaciones, con detección de cruces (RN-14).
  - name: attendance
    description: Asistencia por sesión con sincronización idempotente, cierre y corrección auditada (RN-15).
  - name: evaluations
    description: Rondas de evaluación, conceptos independientes de los tres evaluadores, unanimidad y ascenso de categoría.
  - name: competitions
    description: Torneos, partidos, convocatoria con elegibilidad (RN-06, RN-07), autorización del acudiente y resultados.
  - name: enrollments
    description: Radicación de inscripciones por el acudiente.
  - name: players
    description: Consulta de jugadores según el rol y el vínculo con el acudiente.
  - name: audit
    description: Consulta de la bitácora de auditoría (CU-14, RF-051), solo para la coordinación.
  - name: reports
    description: Cartera por categoría con exportación a CSV, resumen de temporada (CU-10 a CU-12), informe PDF por jugador y cierre o reapertura del expediente.
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión con correo y contraseña.
      description: |
        Devuelve un access token (JWT, vigencia corta) y un refresh token opaco. Toda causa de rechazo (correo
        inexistente, contraseña errónea, cuenta bloqueada o inhabilitada) produce la MISMA respuesta 401, para no
        revelar qué cuentas existen. Tras 5 intentos fallidos consecutivos la cuenta se bloquea 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión abierta.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renueva la sesión canjeando un refresh token (rotación).
      description: |
        Cada refresh token se usa UNA sola vez y se reemplaza por uno nuevo. Presentar uno ya canjeado revoca toda
        la sesión (posible robo): hay que iniciar sesión de nuevo. La sesión tiene además un tope absoluto de 30 días.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Par de tokens nuevo.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cierra la sesión del refresh token indicado.
      description: 'Idempotente y silencioso: responde 204 aunque el token no exista o ya esté revocado.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Sesión cerrada.
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      summary: Cuenta del access token presentado, con su estado actual.
      description: Se lee de la base, no del token. Una cuenta inexistente o no activa responde 401.
      responses:
        '200':
          description: Cuenta autenticada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    post:
      tags: [users]
      operationId: createStaffUser
      summary: Crea una cuenta de personal (coordinador, entrenador, evaluador o comité técnico).
      description: |
        Solo el coordinador. No admite el rol GUARDIAN: las cuentas de acudiente nacen con la inscripción.
        La contraseña inicial exige 12 a 72 bytes con al menos una letra y un dígito.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /guardians:
    post:
      tags: [guardians]
      operationId: registerGuardian
      summary: Autorregistro de un acudiente (público).
      description: |
        Crea la cuenta (rol GUARDIAN) y la ficha del acudiente; con ella se inicia sesión y se radica la inscripción.
        El documento debe ser de adulto (CC, CE o PA). Limitaciones conocidas: no verifica el correo ni limita la tasa
        por IP, y revela si un correo o documento ya está registrado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterGuardianRequest' }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /calls/open:
    get:
      tags: [calls]
      operationId: listOpenCalls
      summary: Convocatorias abiertas en este momento.
      description: Publicadas y dentro de su ventana, según el reloj del servidor de base de datos. Cualquier usuario autenticado.
      responses:
        '200':
          description: Convocatorias abiertas (la que cierra primero va antes).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CallResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /seasons:
    post:
      tags: [seasons]
      operationId: createSeason
      summary: Crea una temporada planificada (solo coordinador).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSeasonRequest' }
      responses:
        '201':
          description: Temporada creada en estado PLANNED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [seasons]
      operationId: listSeasons
      summary: Lista las temporadas, la más reciente primero (solo coordinador).
      responses:
        '200':
          description: Temporadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeasonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /seasons/{seasonId}/activate:
    post:
      tags: [seasons]
      operationId: activateSeason
      summary: Activa una temporada planificada (solo coordinador).
      description: |
        PLANNED a ACTIVE. No impone una sola temporada activa (pendiente de confirmación del cliente). El cierre y la
        reapertura corresponden al caso de uso CU-11 y no se exponen aún.
      parameters:
        - { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Temporada activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /calls:
    post:
      tags: [calls]
      operationId: createCall
      summary: Crea una convocatoria en borrador (solo coordinador).
      description: |
        RF-043. Queda en DRAFT: los acudientes no la ven hasta publicarla. La temporada debe existir y no estar cerrada.
        Pendiente (decisiones del cliente DP-01 y DP-04): cupos por categoría y documentos obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCallRequest' }
      responses:
        '201':
          description: Convocatoria creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [calls]
      operationId: listCalls
      summary: Lista convocatorias con filtros opcionales (solo coordinador).
      description: Más recientes primero; máximo 200 filas.
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/CallStatus' } }
      responses:
        '200':
          description: Convocatorias.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CallDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /calls/{callId}:
    parameters:
      - { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [calls]
      operationId: getCall
      summary: Consulta una convocatoria (solo coordinador).
      responses:
        '200':
          description: Convocatoria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [calls]
      operationId: updateCall
      summary: Modifica una convocatoria (solo coordinador).
      description: |
        Modificación parcial: un campo ausente no se toca; instrucciones vacías las borran. En borrador se puede cambiar
        todo. Publicada solo admite cambiar el cierre y las instrucciones, y mover el cierre exige `reason`.
        Una cancelada no se modifica (RESOURCE_STATE_CONFLICT). Cada cambio queda auditado con el estado anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCallRequest' }
      responses:
        '200':
          description: Convocatoria actualizada (o sin cambios si los valores coinciden).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /calls/{callId}/publish:
    post:
      tags: [calls]
      operationId: publishCall
      summary: Publica una convocatoria en borrador (solo coordinador).
      description: DRAFT a PUBLISHED. Exige que el cierre aún no haya ocurrido según el reloj de la base de datos.
      parameters:
        - { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Convocatoria publicada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /calls/{callId}/cancel:
    post:
      tags: [calls]
      operationId: cancelCall
      summary: Cancela una convocatoria con motivo (solo coordinador).
      description: |
        DRAFT o PUBLISHED a CANCELLED. Cierra la recepción de nuevas inscripciones; no anula las ya radicadas.
      parameters:
        - { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelCallRequest' }
      responses:
        '200':
          description: Convocatoria cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /calls/{callId}/exceptions:
    parameters:
      - { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [calls]
      operationId: grantCallException
      summary: Concede una habilitación excepcional a un acudiente (solo coordinador).
      description: |
        RF-044 / RN-01. Permite al acudiente radicar fuera de la ventana mientras la habilitación esté vigente. Exige
        motivo y vencimiento futuro, con un tope configurable (por defecto 30 días). Solo en convocatorias publicadas.
        No se edita ni se revoca: caduca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantExceptionRequest' }
      responses:
        '201':
          description: Habilitación concedida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallExceptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [calls]
      operationId: listCallExceptions
      summary: Lista las habilitaciones de una convocatoria (solo coordinador).
      responses:
        '200':
          description: Habilitaciones, la más reciente primero.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CallExceptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    post:
      tags: [categories]
      operationId: createCategory
      summary: Crea una categoría (solo coordinador).
      description: |
        Rango de años de nacimiento y cupo parametrizables (RN-04; los valores del club están pendientes, DP-01). Dos
        categorías activas no pueden cubrir el mismo año: lo impone una restricción de la base de datos (V14) y se
        informa como error de campo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Categoría creada y activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [categories]
      operationId: listCategories
      summary: Lista las categorías con su cupo ocupado (coordinador y comité).
      description: La más joven primero. Por defecto solo activas.
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Categorías.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories/{categoryId}:
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [categories]
      operationId: getCategory
      summary: Consulta una categoría (coordinador y comité).
      responses:
        '200':
          description: Categoría.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Modifica una categoría (solo coordinador).
      description: |
        Parcial: un campo ausente no se toca; `clearNextCategory` quita el destino de ascenso. El cupo no puede ser menor
        que los jugadores ya asignados. Desactivar libera el rango; reactivar exige que siga libre. El destino de
        ascenso no puede formar un ciclo. Cada cambio queda auditado con estado anterior y posterior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Categoría actualizada (o sin cambios si los valores coinciden).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/category-suggestion:
    get:
      tags: [categories, players]
      operationId: suggestCategory
      summary: Categoría sugerida por año de nacimiento (coordinador y comité).
      description: |
        RF-046. Devuelve la categoría activa que cubre el año de nacimiento del jugador, con su cupo disponible, o
        `suggested: null` si ninguna lo cubre. Es solo una sugerencia: la decisión es del Comité Técnico.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sugerencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuggestionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /players/{playerId}/assignments:
    post:
      tags: [committee, players]
      operationId: assignCategory
      summary: Asigna categoría, entrenador titular y panel de tres evaluadores (solo comité técnico).
      description: |
        Transición T-01 (DDS UC-02): SUBMITTED o COMMITTEE_PENDING → CATEGORY_ASSIGNED, respaldada por un acta
        (número, fecha no futura, asistentes y archivo ya almacenado `minuteFileId`).

        Reglas: el entrenador titular debe ser una cuenta activa con rol COACH; el panel son exactamente tres
        evaluadores distintos con cuenta activa y un rol admitido (`canchatrack.committee.panel-roles`, por defecto
        EVALUATOR, COACH y COMMITTEE; el entrenador titular puede integrar el panel). La categoría debe estar activa y
        tener cupo; si no lo tiene, el comité puede asignar igualmente enviando `capacityExceptionReason`
        (`canchatrack.committee.allow-capacity-exception`), y el motivo queda en la asignación y en la auditoría. Si el
        jugador vuelve de un proceso anterior, su categoría y panel previos se cierran (el historial se conserva).

        Todos los errores de campo se devuelven juntos. Si alguno es del panel (`headCoachId`, `evaluatorIds`) el
        código es PANEL_INVALID; en otro caso VALIDATION_FAILED. Los valores son provisionales hasta que el club
        responda DP-01.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignCategoryRequest' }
      responses:
        '201':
          description: Categoría asignada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El expediente no está pendiente de decisión (PLAYER_STATE_CONFLICT) o la categoría no tiene cupo y no se
            indicó una excepción válida (CATEGORY_FULL, con `capacity` y `occupied`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Datos inválidos (VALIDATION_FAILED) o panel inválido (PANEL_INVALID), con la lista `errors` por campo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
  /players/{playerId}/rejections:
    post:
      tags: [committee, players]
      operationId: rejectEnrollment
      summary: Rechaza la inscripción con motivo y acta (solo comité técnico).
      description: |
        Transición T-02 (DDS UC-02): SUBMITTED o COMMITTEE_PENDING → REJECTED. El motivo y el acta son obligatorios.
        Un jugador rechazado puede volver a radicar (RN-20).
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectEnrollmentRequest' }
      responses:
        '201':
          description: Inscripción rechazada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/assignment:
    get:
      tags: [committee, players]
      operationId: getCurrentAssignment
      summary: Categoría, entrenador titular y panel vigentes (coordinador y comité).
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Asignación vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El jugador no existe o no tiene una asignación vigente (RESOURCE_NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /enrollments:
    post:
      tags: [enrollments]
      operationId: submitEnrollment
      summary: Radica la inscripción de un jugador (solo acudiente).
      description: |
        Crea el expediente del jugador (o reutiliza el de un jugador propio cuyo proceso anterior terminó: no aceptado
        o temporada cerrada), vincula al acudiente como principal, registra el consentimiento de datos y la
        autorización de participación, y devuelve la constancia con el código de radicación.

        Reglas: convocatoria publicada y dentro de su ventana, o habilitación excepcional vigente del acudiente
        (RN-01, RF-044); sin proceso en curso del jugador; ambas aceptaciones obligatorias. Todo rechazo de negocio
        deja rastro de auditoría. Los conflictos con jugadores existentes responden siempre con el mismo mensaje
        genérico (PLAYER_STATE_CONFLICT) para no revelar qué documentos existen. Pendiente: adjuntar documentos
        (módulo documents) y notificaciones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitEnrollmentRequest' }
      responses:
        '201':
          description: Inscripción radicada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La convocatoria no existe o no está publicada (RESOURCE_NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Convocatoria cerrada o cancelada (ENROLLMENT_CLOSED), o conflicto con el jugador (PLAYER_STATE_CONFLICT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players:
    get:
      tags: [players]
      operationId: listPlayers
      summary: Lista jugadores según el alcance del rol.
      description: |
        Coordinador y comité técnico ven todos; el acudiente, solo los jugadores con vínculo vigente; el entrenador y el
        evaluador, solo los jugadores que entrenan (entrenador titular vigente) o evalúan (asignación vigente). Cualquier
        otro rol recibe 403.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PlayerStatus' }
        - name: page
          in: query
          required: false
          description: Página, desde 0 (los valores negativos se tratan como 0).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Tamaño de página; se limita a 1..100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de jugadores, del más reciente al más antiguo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}:
    get:
      tags: [players]
      operationId: getPlayer
      summary: Expediente de un jugador con sus inscripciones.
      description: |
        Sin acceso y sin existencia responden igual (404): no se revela qué jugadores existen. El entrenador titular y el
        evaluador asignado reciben solo los datos básicos: `documentType` y `documentNumber` se omiten y `enrollments`
        va vacío (traen datos del acudiente).
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Jugador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El jugador no existe o el usuario no tiene acceso (RESOURCE_NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Sube un archivo de soporte (PDF, PNG o JPEG).
      description: |
        `multipart/form-data` con la parte `file`. Se valida el tamaño (`canchatrack.files.max-size`, 10 MB por
        defecto), el tipo declarado y los primeros bytes del contenido; el nombre se sanea. El archivo es inmutable.
        Su `id` se usa después como `minuteFileId` (acta) o `receiptFileId` (comprobante de pago).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Archivo almacenado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Formato, tamaño o contenido inválido (FILE_REJECTED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /files/{fileId}:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Descarga un archivo (quien lo subió, coordinador o comité).
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Contenido del archivo, como adjunto y con la cabecera nosniff.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /document-types:
    get:
      tags: [documents]
      operationId: listDocumentTypes
      summary: Lista los tipos de documento que el club exige (cualquier usuario autenticado).
      description: Solo la coordinación puede pedir también los desactivados (`includeInactive=true`); para los demás roles el parámetro se ignora.
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Catálogo, los obligatorios primero.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DocumentTypeResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [documents]
      operationId: createDocumentType
      summary: Crea un tipo de documento (solo coordinador).
      description: |
        El código es estable (`MAYUSCULAS_CON_GUION_BAJO`) y no cambia después, igual que `containsHealthData`: ya habrá
        versiones que dependen de ellos. `validityDays` solo aplica si el documento vence; si se indica y el usuario no
        da la fecha de vencimiento, esta se calcula como emisión + días. Sin `allowedContentTypes` se admiten PDF, PNG y JPEG.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentTypeRequest' }
      responses:
        '201':
          description: Tipo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /document-types/{typeId}:
    patch:
      tags: [documents]
      operationId: updateDocumentType
      summary: Modifica o desactiva un tipo de documento (solo coordinador).
      description: Los campos ausentes no cambian. Un tipo no se borra, se desactiva. Una lista vacía de `allowedContentTypes` quita la restricción propia del tipo.
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDocumentTypeRequest' }
      responses:
        '200':
          description: Tipo actualizado (o sin cambios).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /document-windows:
    get:
      tags: [documents]
      operationId: listDocumentWindows
      summary: Lista las ventanas de carga (solo coordinador), las más recientes primero.
      parameters:
        - { name: documentTypeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: playerId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Incluye también las generales.' }
      responses:
        '200':
          description: Ventanas.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DocumentWindowResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [documents]
      operationId: openDocumentWindow
      summary: Habilita la carga de un tipo de documento durante un periodo (solo coordinador).
      description: |
        Sin `playerId` la ventana es general (todos los jugadores). Es lo que permite al acudiente cargar una versión nueva
        cuando el documento vigente aún no vence (RN-05). Queda auditada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDocumentWindowRequest' }
      responses:
        '201':
          description: Ventana creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentWindowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/documents:
    get:
      tags: [documents]
      operationId: listPlayerDocuments
      summary: Estado de cada documento del jugador y si quien consulta puede cargar una versión ahora.
      description: |
        Coordinación, acudiente vinculado, entrenador titular de la categoría y comité. Los documentos de salud solo los
        ven la coordinación, el entrenador titular y el acudiente (RF-009): el comité no los recibe en la lista.
        Quien no puede ver al jugador recibe 404.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Un elemento por tipo de documento activo visible.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerDocumentResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documents]
      operationId: uploadPlayerDocument
      summary: Carga una versión nueva de un documento del jugador (acudiente vinculado o coordinación).
      description: |
        `multipart/form-data`: `file` y `documentTypeId` (obligatorios); `issuedOn`, `expiresOn` (AAAA-MM-DD) y `notes`.
        Cada carga es una versión nueva e inmutable: nada se reemplaza ni se borra (RF-008). El acudiente puede cargar la
        primera versión siempre, y las siguientes solo con una ventana habilitada o cuando el vigente está vencido o vence
        en 30 días o menos (RN-05); si no, 409 `DOCUMENT_UPLOAD_NOT_ALLOWED`. Un documento que vence exige fecha de
        vencimiento futura (o una vigencia definida en el tipo).
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentTypeId]
              properties:
                file: { type: string, format: binary }
                documentTypeId: { type: string, format: uuid }
                issuedOn: { type: string, format: date }
                expiresOn: { type: string, format: date }
                notes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Versión registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No hay ventana habilitada ni vencimiento próximo (DOCUMENT_UPLOAD_NOT_ALLOWED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/document-types/{typeId}/versions:
    get:
      tags: [documents]
      operationId: listDocumentVersions
      summary: Historial completo de un tipo de documento del jugador, la versión más reciente primero.
      description: Mismas reglas de acceso que el listado. La consulta de un documento de salud queda auditada (`DOCUMENT_HEALTH_VIEWED`).
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versiones.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DocumentVersionResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /players/{playerId}/documents/versions/{versionId}/file:
    get:
      tags: [documents]
      operationId: downloadDocumentVersion
      summary: Descarga el archivo de una versión.
      description: |
        Mismas reglas de acceso que el listado. Un documento de salud solo lo descargan la coordinación, el entrenador
        titular y el acudiente, y cada descarga queda auditada. Se entrega como adjunto, sin caché y con `nosniff`. El
        mismo archivo tampoco se entrega al comité por `GET /files/{id}`.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Contenido del archivo.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /fees:
    get:
      tags: [payments]
      operationId: listFees
      summary: Lista tarifas (coordinador y comité), opcionalmente de una temporada.
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tarifas.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FeeResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [payments]
      operationId: createFee
      summary: Crea una tarifa (solo coordinador).
      description: |
        Concepto ENROLLMENT, MONTHLY u OTHER; monto positivo con hasta dos decimales (COP). Los montos y el calendario
        de cobro los define el club (DP-05): se cargan aquí sin cambiar código.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFeeRequest' }
      responses:
        '201':
          description: Tarifa creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/registration:
    post:
      tags: [payments, players]
      operationId: startRegistration
      summary: Inicia la matrícula (solo coordinador).
      description: |
        CATEGORY_ASSIGNED → PENDING_REGISTRATION. Genera el cargo de matrícula con el monto de la tarifa ENROLLMENT
        indicada (el cargo conserva ese monto aunque la tarifa cambie después). Repetir con la misma tarifa no duplica el cargo.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRegistrationRequest' }
      responses:
        '201':
          description: Matrícula iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El jugador no está en CATEGORY_ASSIGNED (PLAYER_STATE_CONFLICT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/activation:
    post:
      tags: [payments, players]
      operationId: activatePlayer
      summary: Activa al jugador con la matrícula saldada (solo coordinador).
      description: PENDING_REGISTRATION → ACTIVE. Si la matrícula tiene saldo pendiente responde 409 PLAYER_STATE_CONFLICT.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Jugador activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El jugador no está pendiente de matrícula o la matrícula no está saldada (PLAYER_STATE_CONFLICT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /players/{playerId}/payments:
    post:
      tags: [payments]
      operationId: recordPayment
      summary: Registra un pago aplicado a un cargo del jugador (solo coordinador).
      description: |
        Los pagos son inmutables (RN-16): un error se corrige anulando el pago y registrando el correcto. El monto no
        puede superar lo que el cargo aún debe; el cargo no puede estar anulado ni saldado. `paidAt` por defecto es el
        reloj del servidor y no puede ser futuro. `receiptFileId` debe ser un archivo ya subido.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordPaymentRequest' }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /payments/{paymentId}/void:
    post:
      tags: [payments]
      operationId: voidPayment
      summary: Anula un pago con un asiento compensatorio y motivo (solo coordinador).
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidPaymentRequest' }
      responses:
        '200':
          description: Pago anulado, con voided verdadero y netAmount en cero.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/account:
    get:
      tags: [payments, players]
      operationId: getAccount
      summary: Estado de cuenta del jugador (coordinador, comité y acudiente vinculado).
      description: Totales derivados (cargado, pagado, saldo), cargos con su saldo y pagos. Sin acceso responde 404.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado de cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /billing/monthly:
    post:
      tags: [payments]
      operationId: generateMonthlyCharges
      summary: Genera el cargo mensual de todos los jugadores activos (solo coordinador).
      description: |
        `period` es el primer día del mes; `dueDate` no puede ser anterior. Idempotente por jugador, tarifa y periodo:
        repetir la operación solo crea los cargos que falten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthlyBillingRequest' }
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyBillingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /venues:
    get:
      tags: [scheduling]
      operationId: listVenues
      summary: Lista escenarios (coordinador, comité y entrenador).
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Escenarios.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VenueResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [scheduling]
      operationId: createVenue
      summary: Crea un escenario (solo coordinador).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenueRequest' }
      responses:
        '201':
          description: Escenario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events:
    get:
      tags: [scheduling]
      operationId: listEvents
      summary: Calendario de eventos, filtrable (coordinador y comité, todos; entrenador, solo los suyos).
      description: |
        Los filtros son opcionales y se combinan con Y. El rango `from` (inclusivo) a `to` (exclusivo) da la vista diaria,
        semanal o mensual del calendario. El entrenador siempre queda limitado a los eventos de los que es responsable: si pide
        los de otro entrenador o de una serie ajena, la lista sale vacía. `eventType` y `status` no distinguen mayúsculas.
        Un valor desconocido o un rango invertido responde 422 con todos los errores juntos.
      parameters:
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: venueId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: headCoachId, in: query, required: false, schema: { type: string, format: uuid } }
        - name: eventType
          in: query
          required: false
          schema: { type: string, enum: [TRAINING, EVALUATION, FRIENDLY_MATCH, TOURNAMENT_MATCH] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [CONFIRMED, CANCELLED, COMPLETED] }
        - { name: seriesId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Hasta 500 eventos ordenados por inicio.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [scheduling]
      operationId: scheduleEvent
      summary: Programa un entrenamiento o una evaluación (solo coordinador).
      description: |
        Valida que el evento sea a futuro, que el entrenador responsable tenga cuenta activa con rol COACH y que el
        escenario esté activo. Antes de guardar se detectan cruces (RN-14) de escenario, entrenador y categoría
        (los jugadores pertenecen a una sola categoría): si hay alguno responde 409 SCHEDULE_CONFLICT con la lista
        `conflicts` (dimensión, evento, inicio y fin). Los partidos de torneo los administra el módulo de competencias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleEventRequest' }
      responses:
        '201':
          description: Evento confirmado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events/{eventId}:
    get:
      tags: [scheduling]
      operationId: getEvent
      summary: Detalle de un evento (el entrenador solo ve los suyos; sin acceso responde 404).
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Evento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{eventId}/cancel:
    post:
      tags: [scheduling]
      operationId: cancelEvent
      summary: Cancela un evento confirmado con motivo (solo coordinador).
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEventRequest' }
      responses:
        '200':
          description: Evento cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events/{eventId}/reschedule:
    post:
      tags: [scheduling]
      operationId: rescheduleEvent
      summary: Reprograma un entrenamiento o evaluación confirmado y avisa del cambio (solo coordinador).
      description: >
        Cambia fecha y hora y, si se indican, escenario, entrenador responsable, punto de encuentro e instrucciones (lo no indicado
        se conserva). La hora de concentración no se arrastra: solo existe si se envía de nuevo. Aplica los mismos cruces que al
        programar, sin contar el propio evento. Los partidos se reprograman en `/matches/{matchId}/reschedule`. Avisa por correo
        a los acudientes de la categoría y al entrenador (también al anterior, si cambia) con la invitación de calendario
        actualizada (`SEQUENCE` mayor) y vuelve a programar los recordatorios.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleEventRequest' }
      responses:
        '200':
          description: Evento reprogramado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /event-series:
    post:
      tags: [scheduling]
      operationId: scheduleEventSeries
      summary: Programa una serie semanal de entrenamientos o evaluaciones (solo coordinador).
      description: |
        Crea una sesión por cada fecha entre `startDate` y `endDate` (ambas incluidas) que cae en alguno de los `weekdays`, a
        la misma hora local del club (`startTime` a `endTime`). Máximo 60 sesiones y 366 días; la primera debe ser a futuro.
        Cada sesión es un evento independiente: se cancela, se reprograma y tiene asistencia y recordatorios por su cuenta.
        Es **todo o nada**: si alguna sesión cruza el horario de su escenario, entrenador o categoría (RN-14) no se crea
        ninguna y se responde 409 SCHEDULE_CONFLICT con todos los cruces (`conflicts`, cada uno con `occurrenceStartAt`, la
        sesión de la serie que choca). Un solo correo avisa a los acudientes de la categoría y al entrenador, con una
        invitación de calendario de todas las sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleSeriesRequest' }
      responses:
        '201':
          description: Serie creada, con sus sesiones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /event-series/{seriesId}:
    get:
      tags: [scheduling]
      operationId: getEventSeries
      summary: Detalle de una serie con todas sus sesiones (el entrenador solo ve las suyas; sin acceso responde 404).
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Serie con sus sesiones, también las canceladas, en orden cronológico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /event-series/{seriesId}/cancel:
    post:
      tags: [scheduling]
      operationId: cancelEventSeries
      summary: Cancela las sesiones futuras y confirmadas de una serie con un motivo (solo coordinador).
      description: |
        Las sesiones que ya empezaron, se completaron o se cancelaron antes no se tocan. Cada sesión cancelada queda auditada y un
        solo correo avisa a acudientes y entrenador, con una invitación de cancelación de todas ellas. Una serie sin sesiones
        futuras confirmadas responde 409.
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEventRequest' }
      responses:
        '200':
          description: La serie con sus sesiones ya canceladas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events/{eventId}/attendance:
    get:
      tags: [attendance]
      operationId: getAttendance
      summary: Plantilla de la categoría con la marca de cada jugador.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Asistencia de la sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [attendance]
      operationId: syncAttendance
      summary: Sincroniza un lote de marcas (coordinador o entrenador del evento).
      description: |
        Cada marca lleva un `clientUuid` generado en el dispositivo. Reintentar con la misma `Idempotency-Key` devuelve el
        resultado original (`replayed: true`) sin duplicar; una marca repetida (mismo `clientUuid` o mismo jugador en la
        sesión) cuenta como duplicada. Las marcas inválidas o de jugadores fuera de la plantilla activa se rechazan una a
        una y el resto se acepta. La sesión debe haber comenzado y no estar cerrada (409 ATTENDANCE_SESSION_CLOSED).
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: Resultado del lote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events/{eventId}/attendance/close:
    post:
      tags: [attendance]
      operationId: closeAttendance
      summary: Cierra la sesión (coordinador o entrenador del evento).
      description: Los jugadores de la plantilla sin marca quedan como ausentes y la sesión se bloquea para edición ordinaria (RN-15).
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /events/{eventId}/attendance/corrections:
    post:
      tags: [attendance]
      operationId: correctAttendance
      summary: Corrige una marca de una sesión cerrada, con justificación y rastro.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRequest' }
      responses:
        '200':
          description: Marca corregida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/attendance:
    get:
      tags: [attendance, players]
      operationId: getPlayerAttendance
      summary: Asistencia acumulada del jugador (coordinador, comité, acudiente vinculado y entrenador titular).
      description: |
        Sobre sesiones cerradas: porcentaje = (presentes + tardes) / (sesiones − excusas aceptadas). Una excusa aceptada
        no cuenta a favor ni en contra; una no aceptada cuenta como falta. `percentage` es nulo si no hay sesiones que contar.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /players/{playerId}/evaluation-rounds:
    post:
      tags: [evaluations]
      operationId: openEvaluationRound
      summary: Abre una ronda de evaluación sobre un periodo (solo coordinador).
      description: |
        Solo procede para un jugador ACTIVO con exactamente tres evaluadores vigentes (cuentas activas con rol admitido en
        el panel). El jugador pasa a IN_EVALUATION y solo puede tener una ronda abierta. El vencimiento es obligatorio y futuro.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRoundRequest' }
      responses:
        '201':
          description: Ronda abierta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [evaluations, players]
      operationId: listEvaluationRounds
      summary: Rondas del jugador, la más reciente primero, sin conceptos.
      description: |
        Coordinador y comité las ven siempre; un evaluador, solo las de los jugadores de su panel (si no, 404).
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rondas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /evaluation-rounds/{roundId}:
    get:
      tags: [evaluations]
      operationId: getEvaluationRound
      summary: Detalle de una ronda con sus conceptos.
      description: |
        Coordinador y comité ven todos los conceptos y la vista previa de unanimidad (`outcome`). Un evaluador del panel ve
        solo el suyo mientras la ronda está abierta y todos cuando se cierra (independencia de criterio).
      parameters:
        - { name: roundId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ronda.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /evaluation-rounds/{roundId}/decision:
    put:
      tags: [evaluations]
      operationId: decideEvaluation
      summary: Emite o ajusta el concepto propio del evaluador (RN-08).
      description: |
        Solo un integrante del panel del jugador decide, y solo por sí mismo; la coordinación no puede emitir ni modificar
        conceptos (RN-10). El concepto se registra sobre el periodo vigente de la ronda y puede ajustarse mientras esté abierta;
        cada versión anterior queda en el historial. Un concepto FOLLOW_UP_REQUIRED o UNFAVORABLE exige `justification` y
        `actions` (RN-11, código NEGATIVE_REASON_REQUIRED). Quien no integra el panel recibe PANEL_INVALID.
      parameters:
        - { name: roundId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluatorDecisionRequest' }
      responses:
        '200':
          description: Concepto registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluatorDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /evaluation-rounds/{roundId}/period:
    put:
      tags: [evaluations]
      operationId: changeEvaluationPeriod
      summary: Cambia el periodo de una ronda abierta con motivo (solo coordinador).
      description: |
        Los conceptos emitidos sobre el periodo anterior dejan de contar para la unanimidad (`current` falso) y los
        evaluadores deben emitirlos de nuevo. Sin `dueAt` se conserva el vencimiento.
      parameters:
        - { name: roundId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePeriodRequest' }
      responses:
        '200':
          description: Ronda con el periodo nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /evaluation-rounds/{roundId}/close:
    post:
      tags: [evaluations]
      operationId: closeEvaluationRound
      summary: Cierra la ronda según la unanimidad (solo coordinador).
      description: |
        Con tres conceptos favorables vigentes el ascenso queda aprobado (jugador en PROMOTION_APPROVED). Con alguno
        desfavorable o con seguimiento, o con conceptos faltantes ya vencida la ronda, el jugador vuelve a ACTIVE y
        `followUpPlan` es obligatorio (RN-12). Con conceptos faltantes y la ronda vigente responde 409.
      parameters:
        - { name: roundId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseRoundRequest' }
      responses:
        '200':
          description: Ronda cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/promotion:
    post:
      tags: [evaluations, players]
      operationId: promotePlayer
      summary: Ejecuta el ascenso aprobado a la categoría siguiente (solo coordinador).
      description: |
        Exige el jugador en PROMOTION_APPROVED y cupo en la categoría destino (CATEGORY_FULL si no). Sin
        `targetCategoryId` se usa la categoría siguiente de la actual. La asignación anterior se cierra sin borrarse
        (historial conservado) y el panel de evaluadores se mantiene.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRequest' }
      responses:
        '200':
          description: Ascenso ejecutado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tournaments:
    post:
      tags: [competitions]
      operationId: createTournament
      summary: Registra un torneo de la temporada (solo coordinador, RF-031).
      description: |
        Nombre único por temporada. Categoría, escenario y reglamento son opcionales: un torneo puede abarcar varias
        categorías. Si declara categoría, sus partidos deben ser de esa categoría; si declara fechas, los partidos deben
        jugarse dentro de ellas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTournamentRequest' }
      responses:
        '201':
          description: Torneo registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [competitions]
      operationId: listTournaments
      summary: Lista los torneos (coordinador, comité y entrenadores).
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Torneos ordenados por fecha de inicio.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TournamentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /matches:
    post:
      tags: [competitions]
      operationId: scheduleMatch
      summary: Programa un partido (solo coordinador, RN-13, RF-032).
      description: |
        Crea el evento deportivo del partido (amistoso si no hay torneo, de torneo si lo hay) con las mismas reglas de
        agenda que un entrenamiento: escenario, entrenador responsable y categoría no pueden cruzarse con otro evento
        (RN-14, 409 SCHEDULE_CONFLICT con los eventos en conflicto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleMatchRequest' }
      responses:
        '201':
          description: Partido programado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [competitions]
      operationId: listMatches
      summary: Lista partidos. Coordinador y comité ven todos; el entrenador, solo los suyos.
      parameters:
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: tournamentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Partidos ordenados por inicio (máximo 200).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /matches/{matchId}:
    get:
      tags: [competitions]
      operationId: getMatch
      summary: Detalle del partido con su convocatoria (coordinador, comité y entrenador responsable).
      description: |
        El entrenador que no es responsable del partido recibe 404. La convocatoria incluye el estado de cada jugador, la
        causa de no elegibilidad y el detalle de requisitos; son datos del personal y nunca se muestran al acudiente.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Partido y convocatoria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /matches/{matchId}/cancel:
    post:
      tags: [competitions]
      operationId: cancelMatch
      summary: Cancela un partido confirmado con motivo (solo coordinador).
      description: |
        Queda auditado y se avisa a los acudientes de los jugadores con convocatoria confirmada. Un partido ya realizado
        o cancelado responde 409.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelMatchRequest' }
      responses:
        '200':
          description: Partido cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /matches/{matchId}/reschedule:
    post:
      tags: [competitions]
      operationId: rescheduleMatch
      summary: Reprograma un partido confirmado y avisa del cambio (solo coordinador).
      description: |
        Cambia fecha y hora y, si se indican, escenario, entrenador responsable, punto de encuentro e instrucciones (lo no
        indicado se conserva; la hora de concentración solo existe si se envía de nuevo). Aplica los cruces de agenda sin contar
        el propio partido y, en un partido de torneo, exige que la nueva fecha caiga dentro del torneo. Un partido ya empezado,
        realizado o cancelado responde 409.

        La convocatoria se conserva: los jugadores propuestos o no elegibles se evalúan de nuevo con la nueva fecha; los
        confirmados siguen confirmados, y los que con la nueva fecha ya no cumplen un requisito se devuelven en
        `confirmedToReview` (con sus causas) para que la coordinación decida. Los acudientes de los confirmados reciben el aviso
        y la autorización de participación ya dada no se revoca.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleMatchRequest' }
      responses:
        '200':
          description: Partido reprogramado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescheduleMatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /matches/{matchId}/callup:
    post:
      tags: [competitions]
      operationId: proposeCallup
      summary: Propone jugadores para el partido (entrenador responsable o coordinador, RF-033).
      description: |
        Cada jugador se evalúa contra RN-06 y RN-07: activo en la categoría, certificado médico vigente el día del
        partido, autorización de participación vigente y política de mora. Quien no cumple queda en `NOT_ELIGIBLE` con la
        causa (`PLAYER_NOT_ACTIVE`, `MEDICAL_CERTIFICATE_INVALID`, `PARTICIPATION_AUTHORIZATION_INVALID` o
        `ARREARS_POLICY`) y no se convoca. Proponer de nuevo re-evalúa; los ya confirmados no cambian. Solo antes de que
        el partido comience.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallupPlayersRequest' }
      responses:
        '200':
          description: Estado de cada jugador propuesto.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CallupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /matches/{matchId}/callup/{playerId}:
    delete:
      tags: [competitions]
      operationId: removeCallup
      summary: Quita a un jugador de la convocatoria (entrenador responsable o coordinador).
      description: Idempotente. Si el jugador estaba confirmado, se avisa a sus acudientes.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Jugador retirado de la convocatoria.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /matches/{matchId}/callup/confirm:
    post:
      tags: [competitions]
      operationId: confirmCallup
      summary: Confirma la convocatoria de los jugadores propuestos (solo coordinador).
      description: |
        Vuelve a evaluar a cada jugador. Si alguno ya no cumple, nada se confirma y responde 409 `CALLUP_NOT_ELIGIBLE`
        con `players: [{playerId, causes}]`. Solo se confirman jugadores en `PROPOSED` (otro estado responde 409 con
        `players`). Al confirmar se avisa a los acudientes, sin datos de salud (RF-035).
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallupPlayersRequest' }
      responses:
        '200':
          description: Estado de los jugadores indicados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CallupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /matches/{matchId}/players/{playerId}/authorization:
    post:
      tags: [competitions]
      operationId: authorizeMatchParticipation
      summary: El acudiente autoriza la participación o el desplazamiento de su hijo (RF-034).
      description: |
        Solo el acudiente con vínculo vigente con el jugador, y solo si el jugador tiene convocatoria confirmada
        (en otro caso 404, para no revelar propuestas ni causas de no elegibilidad). Idempotente: repetirla responde 200
        con `recordedNow: false`.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Autorización vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchAuthorizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /matches/{matchId}/result:
    put:
      tags: [competitions]
      operationId: recordMatchResult
      summary: Registra el resultado, los minutos y los goles (entrenador responsable o coordinador, RF-036).
      description: |
        Desde que el partido comienza. Los jugadores deben tener convocatoria confirmada y la suma de goles individuales
        no puede superar los goles a favor. El partido pasa a `COMPLETED`. Un resultado ya registrado solo se corrige
        con `reason`, y la corrección queda auditada con el marcador anterior.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchResultRequest' }
      responses:
        '200':
          description: Partido con el resultado registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/matches:
    get:
      tags: [competitions, players]
      operationId: listPlayerMatches
      summary: Historial de partidos del jugador con convocatoria confirmada (RF-037).
      description: |
        Acudiente (solo sus hijos), coordinador, comité y entrenador titular del jugador. Incluye partidos cancelados para que el acudiente vea el cambio.
        Nunca expone causas de no elegibilidad ni datos de salud.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Partidos del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlayerMatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit/events:
    get:
      tags: [audit]
      operationId: searchAuditEvents
      summary: Consulta la bitácora de auditoría (CU-14, RF-051). Solo coordinador.
      description: |
        Eventos del más reciente al más antiguo con filtros opcionales combinables. Sirve para reconstruir el historial de
        decisiones, cambios de categoría, conceptos, correcciones y cambios de estado: filtre por `entityType` y `entityId`
        (por ejemplo `player`) o por `action` (`PLAYER_CATEGORY_ASSIGNED`, `EVALUATOR_DECISION_RECORDED`,
        `ATTENDANCE_CORRECTED`, `PLAYER_PROMOTED`…).

        Paginación por cursor: la respuesta trae `nextCursor` mientras haya más; envíelo en `cursor` para pedir la
        siguiente página. `from` es inclusivo y `to` exclusivo. La primera página de cada búsqueda queda registrada como
        `AUDIT_QUERIED` (con los filtros, sin el contenido devuelto). Los resúmenes `before` y `after` no contienen datos
        de salud ni secretos, y la respuesta no incluye IP ni agente de usuario.
      parameters:
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: entityType, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: entityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [SUCCESS, DENIED, FAILURE] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, description: 'Tamaño de página, 1 a 200 (50 por defecto).', schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, description: Valor opaco de `nextCursor`., schema: { type: string } }
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/receivables:
    get:
      tags: [reports]
      operationId: getReceivablesReport
      summary: Cartera por categoría (RF-042). Coordinador y comité.
      description: |
        Cargos con saldo pendiente (pendientes o con pago parcial; los anulados y saldados no cuentan), con jugador,
        acudiente principal, concepto, valor neto, pagado, saldo y días de mora al día `asOf` (hoy en la zona del club por
        defecto). `categories` suma todos los cargos por categoría; `lines` se corta en 5000 filas y entonces `truncated`
        es verdadero. Un jugador sin categoría vigente aparece en «Sin categoría».
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Reporte de cartera.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivablesReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/receivables/export:
    get:
      tags: [reports]
      operationId: exportReceivablesReport
      summary: Exporta la cartera a CSV, que abre en Excel (RF-042). Coordinador y comité.
      description: |
        Mismos filtros y contenido de `lines` que `/reports/receivables`, con encabezados en español. UTF-8 con marca BOM
        para que Excel respete las tildes; los textos que empezarían por `=`, `+`, `-` o `@` se prefijan con `'` para
        evitar inyección de fórmulas. Cada exportación queda auditada (`REPORT_EXPORTED`). Respuesta sin caché.
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Archivo CSV (`cartera-AAAA-MM-DD.csv`).
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/season-summary:
    get:
      tags: [reports]
      operationId: getSeasonSummary
      summary: Resumen de una temporada (CU-10 a CU-12). Coordinador y comité.
      description: |
        Plantilla por categoría, eventos por tipo y estado, asistencia de las sesiones cerradas, resultados de los partidos
        completados y recaudo, todo delimitado por la ventana de la temporada. `seasonId` es obligatorio. El informe PDF
        versionado por jugador y el cierre del expediente se documentan en `/players/{playerId}/season-reports` y `/players/{playerId}/season-closure`.
      parameters:
        - { name: seasonId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumen de la temporada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /players/{playerId}/season-reports:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [reports]
      operationId: generateSeasonReport
      summary: Genera el informe de temporada del jugador (CU-10, RF-049). Solo coordinador.
      description: |
        Produce un PDF con asistencia, evaluaciones publicadas (rondas cerradas) y participación en partidos del periodo de
        la temporada (hasta hoy si aún no termina; el informe lo declara parcial). Recibe consecutivo único (`number`), código
        de verificación y huella SHA-256 del archivo, y congela los datos usados. Regenerar crea una versión nueva que apunta a
        la anterior y exige `reason`; las versiones previas se conservan. La temporada no puede estar en estado `PLANNED` y el
        jugador debe tener trayectoria (activo, en evaluación, con ascenso aprobado, suspendido, retirado o con la temporada
        cerrada) y categoría asignada. El PDF se descarga con `GET /files/{fileId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonReportRequest' }
      responses:
        '201':
          description: Informe generado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500':
          description: No fue posible producir el PDF (REPORT_GENERATION_FAILED); puede reintentarse.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [reports]
      operationId: listSeasonReports
      summary: Informes de temporada del jugador, el más reciente primero. Coordinador y comité.
      parameters:
        - { name: seasonId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versiones generadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeasonReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /season-reports/verify:
    get:
      tags: [reports]
      operationId: verifySeasonReport
      summary: Comprueba el código de verificación impreso en un informe. Coordinador y comité.
      description: |
        Acepta el código con o sin guiones y en mayúsculas o minúsculas. `current` es falso si existe una versión más
        reciente del mismo informe. Un código mal formado o desconocido responde igual: 404. La verificación pública, sin
        sesión, queda pendiente hasta contar con límite de tasa.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Informe al que pertenece el código.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonReportVerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /season-reports/{reportId}:
    get:
      tags: [reports]
      operationId: getSeasonReport
      summary: Metadatos de un informe de temporada. Coordinador y comité.
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Informe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /players/{playerId}/season-closure:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [reports]
      operationId: closeSeasonForPlayer
      summary: Cierra la temporada del expediente (CU-11, T-11, RN-18). Solo coordinador.
      description: |
        ACTIVE → SEASON_CLOSED. Exige el informe vigente (la última versión) del jugador y la temporada, y que el expediente
        deportivo no haya cambiado después de generarlo (asistencia, correcciones, evaluaciones o resultados); si cambió,
        hay que generar una versión nueva. Un jugador en evaluación o con un ascenso aprobado pendiente debe resolverlo
        antes. El cierre deja el expediente en solo lectura para los flujos deportivos, conserva la categoría y todo el
        historial, y queda en auditoría y en el historial de estados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonClosureRequest' }
      responses:
        '201':
          description: Expediente cerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonClosureResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [reports]
      operationId: getSeasonClosure
      summary: Último cierre del expediente, vigente o ya reabierto. Coordinador y comité.
      responses:
        '200':
          description: Cierre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonClosureResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /players/{playerId}/season-closure/reopen:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [reports]
      operationId: reopenSeasonForPlayer
      summary: Reabre el expediente cerrado (CU-11, T-12, RN-18). Solo coordinador.
      description: |
        SEASON_CLOSED → ACTIVE. Exige motivo, detalle y la confirmación reforzada: escribir el código del jugador. No borra
        nada: el cierre queda marcado como reabierto con quién, cuándo y por qué, y se audita. Si se corrige algo, se genera
        una versión nueva del informe antes de volver a cerrar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonReopenRequest' }
      responses:
        '200':
          description: Expediente reabierto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonClosureResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT (HS256) emitido por POST /auth/login o /auth/refresh. Lleva sub (id de cuenta) y roles.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única por intento lógico. Reenviar la misma clave con el mismo cuerpo no repite el efecto.
      schema:
        type: string
        minLength: 8
        maxLength: 100
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación opcional (8-64 caracteres A-Za-z0-9._-). Si falta, el servidor lo genera.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
  headers:
    X-Correlation-Id:
      description: Identificador de correlación de la solicitud.
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254, examples: [coordinador@club.test] }
        password: { type: string, maxLength: 128, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 256 }
    CreateUserRequest:
      type: object
      required: [email, fullName, password, roles]
      properties:
        email: { type: string, maxLength: 254 }
        fullName: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 128, format: password }
        roles:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/StaffRole' }
    StaffRole:
      type: string
      description: Roles asignables por el coordinador. GUARDIAN queda excluido a propósito.
      enum: [COORDINATOR, COACH, EVALUATOR, COMMITTEE]
    UserResponse:
      type: object
      required: [id, email, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [GUARDIAN, COORDINATOR, COACH, EVALUATOR, COMMITTEE] }
    SessionResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken: { type: string, description: 'JWT. Se envía en la cabecera Authorization como: Bearer <token>.' }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: 'Segundos de vigencia del access token.' }
        refreshToken: { type: string, description: 'Valor opaco; se muestra una sola vez y no puede recuperarse.' }
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserResponse' }
    RegisterGuardianRequest:
      type: object
      required: [email, fullName, password, documentType, documentNumber]
      properties:
        email: { type: string, maxLength: 254 }
        fullName: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 128, format: password }
        documentType: { type: string, enum: [CC, CE, PA], description: Documento de persona adulta. }
        documentNumber: { type: string, minLength: 4, maxLength: 30, description: 'Letras, dígitos y guion; se normaliza a mayúsculas.' }
        phone: { type: string, maxLength: 30 }
    CallResponse:
      type: object
      required: [id, name, startAt, endAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        instructions: { type: [string, 'null'] }
    CallStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED]
    SeasonStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED]
    CreateSeasonRequest:
      type: object
      required: [name, startAt, endAt]
      properties:
        name: { type: string, maxLength: 100 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, description: Posterior a startAt. }
    SeasonResponse:
      type: object
      required: [id, name, startAt, endAt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SeasonStatus' }
        createdAt: { type: string, format: date-time }
    CreateCallRequest:
      type: object
      required: [seasonId, name, startAt, endAt]
      properties:
        seasonId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        startAt: { type: string, format: date-time, description: Apertura de la recepción. }
        endAt: { type: string, format: date-time, description: Cierre de la recepción; posterior a startAt. }
        instructions: { type: [string, 'null'], maxLength: 4000 }
    UpdateCallRequest:
      type: object
      description: Todos los campos son opcionales; al menos uno es obligatorio.
      properties:
        name: { type: string, maxLength: 150 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        instructions: { type: string, maxLength: 4000, description: Vacío borra las instrucciones. }
        reason: { type: string, maxLength: 500, description: Obligatorio al mover el cierre de una convocatoria publicada. }
    CancelCallRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    CallDetailResponse:
      type: object
      required: [id, seasonId, name, startAt, endAt, status, windowOpen, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        instructions: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CallStatus' }
        windowOpen:
          type: boolean
          description: Si ahora está dentro de la ventana, según el reloj de la base de datos. Solo recibe inscripciones si además está publicada.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GrantExceptionRequest:
      type: object
      required: [guardianId, reason, expiresAt]
      properties:
        guardianId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
        expiresAt: { type: string, format: date-time, description: Futuro y dentro del tope configurado. }
    CallExceptionResponse:
      type: object
      required: [id, callId, guardianId, reason, grantedBy, grantedAt, expiresAt, active]
      properties:
        id: { type: string, format: uuid }
        callId: { type: string, format: uuid }
        guardianId: { type: string, format: uuid }
        reason: { type: string }
        grantedBy: { type: string, format: uuid }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        active: { type: boolean, description: 'Vigente ahora, según el reloj de la base de datos.' }
    CreateCategoryRequest:
      type: object
      required: [name, birthYearMin, birthYearMax, capacity]
      properties:
        name: { type: string, maxLength: 80 }
        birthYearMin: { type: integer, minimum: 1950, maximum: 2100 }
        birthYearMax: { type: integer, minimum: 1950, maximum: 2100, description: No menor que birthYearMin. }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        nextCategoryId: { type: [string, 'null'], format: uuid, description: Destino del ascenso. }
    UpdateCategoryRequest:
      type: object
      description: Todos los campos son opcionales; al menos uno es obligatorio.
      properties:
        name: { type: string, maxLength: 80 }
        birthYearMin: { type: integer, minimum: 1950, maximum: 2100 }
        birthYearMax: { type: integer, minimum: 1950, maximum: 2100 }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        nextCategoryId: { type: string, format: uuid }
        clearNextCategory: { type: boolean, description: Quita el destino de ascenso; no se combina con nextCategoryId. }
        active: { type: boolean }
    CategoryResponse:
      type: object
      required: [id, name, birthYearMin, birthYearMax, capacity, occupied, available, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        birthYearMin: { type: integer }
        birthYearMax: { type: integer }
        capacity: { type: integer }
        occupied:
          type: integer
          description: Asignaciones vigentes de jugadores en proceso o activos (no retirados, rechazados ni con temporada cerrada).
        available: { type: integer }
        nextCategoryId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
    CategorySuggestionResponse:
      type: object
      required: [playerId, birthYear]
      properties:
        playerId: { type: string, format: uuid }
        birthYear: { type: integer }
        suggested:
          oneOf:
            - { $ref: '#/components/schemas/CategoryResponse' }
            - { type: 'null' }
    MinuteFields:
      type: object
      description: Acta de la reunión del comité que respalda la decisión (RN-03, RF-045).
      required: [minuteNumber, meetingDate, attendees, minuteFileId]
      properties:
        minuteNumber: { type: string, maxLength: 30, examples: [ACTA-2026-014] }
        meetingDate: { type: string, format: date, description: No puede ser futura (zona horaria del club). }
        attendees:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string, maxLength: 150 }
        minuteFileId:
          type: string
          format: uuid
          description: Archivo del acta firmada, ya almacenado (la carga de archivos llega con el módulo documents).
    AssignCategoryRequest:
      allOf:
        - $ref: '#/components/schemas/MinuteFields'
        - type: object
          required: [categoryId, headCoachId, evaluatorIds]
          properties:
            categoryId: { type: string, format: uuid }
            headCoachId: { type: string, format: uuid, description: Cuenta activa con rol COACH. }
            evaluatorIds:
              type: array
              minItems: 3
              maxItems: 3
              description: Exactamente tres cuentas distintas, activas y con un rol admitido en el panel.
              items: { type: string, format: uuid }
            capacityExceptionReason:
              type: string
              maxLength: 2000
              description: Solo se conserva si la categoría no tiene cupo; sin él, una categoría llena responde CATEGORY_FULL.
    RejectEnrollmentRequest:
      allOf:
        - $ref: '#/components/schemas/MinuteFields'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, maxLength: 2000 }
    AssignmentResponse:
      type: object
      required: [playerId, playerStatus, categoryId, categoryName, headCoachId, evaluatorIds, assignedAt]
      properties:
        playerId: { type: string, format: uuid }
        playerStatus: { $ref: '#/components/schemas/PlayerStatus' }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        headCoachId: { type: string, format: uuid }
        evaluatorIds:
          type: array
          items: { type: string, format: uuid }
        minuteNumber: { type: [string, 'null'] }
        meetingDate: { type: [string, 'null'], format: date }
        minuteFileId: { type: [string, 'null'], format: uuid }
        capacityExceptionReason: { type: [string, 'null'] }
        assignedAt: { type: string, format: date-time }
    DecisionResponse:
      type: object
      required: [playerId, playerStatus, minuteNumber]
      properties:
        playerId: { type: string, format: uuid }
        playerStatus: { $ref: '#/components/schemas/PlayerStatus' }
        minuteNumber: { type: string }
    DocumentStatus:
      type: string
      description: MISSING sin versión; VALID vigente; EXPIRING_SOON vence en 30 días o menos; EXPIRED vencido.
      enum: [MISSING, VALID, EXPIRING_SOON, EXPIRED]
    CreateDocumentTypeRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
        name: { type: string, maxLength: 120 }
        mandatory: { type: boolean, default: true }
        requiresExpiry: { type: boolean, default: false }
        validityDays: { type: integer, minimum: 1, maximum: 3650, nullable: true }
        containsHealthData: { type: boolean, default: false }
        maxSizeBytes: { type: integer, format: int64, nullable: true }
        allowedContentTypes:
          type: array
          items: { type: string, enum: [application/pdf, image/png, image/jpeg] }
    UpdateDocumentTypeRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        mandatory: { type: boolean }
        requiresExpiry: { type: boolean }
        validityDays: { type: integer, minimum: 1, maximum: 3650 }
        maxSizeBytes: { type: integer, format: int64 }
        allowedContentTypes:
          type: array
          items: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        active: { type: boolean }
    DocumentTypeResponse:
      type: object
      required: [id, code, name, mandatory, requiresExpiry, containsHealthData, allowedContentTypes, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        mandatory: { type: boolean }
        requiresExpiry: { type: boolean }
        validityDays: { type: integer, nullable: true }
        containsHealthData: { type: boolean }
        maxSizeBytes: { type: integer, format: int64, nullable: true }
        allowedContentTypes: { type: array, items: { type: string } }
        active: { type: boolean }
    OpenDocumentWindowRequest:
      type: object
      required: [documentTypeId, opensAt, closesAt]
      properties:
        documentTypeId: { type: string, format: uuid }
        playerId: { type: string, format: uuid, nullable: true, description: 'Sin jugador la ventana es general.' }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 500 }
    DocumentWindowResponse:
      type: object
      required: [id, documentTypeId, opensAt, closesAt, openedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        playerId: { type: string, format: uuid, nullable: true }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        reason: { type: string, nullable: true }
        openedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    DocumentVersionResponse:
      type: object
      required: [id, playerId, documentTypeId, versionNumber, fileName, contentType, sizeBytes, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        versionNumber: { type: integer }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        issuedOn: { type: string, format: date, nullable: true }
        expiresOn: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        uploadedBy: { type: string, format: uuid }
        uploadedAt: { type: string, format: date-time }
    PlayerDocumentResponse:
      type: object
      required: [type, status, uploadAllowed]
      properties:
        type: { $ref: '#/components/schemas/DocumentTypeResponse' }
        current:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/DocumentVersionResponse' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        uploadAllowed: { type: boolean, description: '¿Puede quien consulta cargar una versión ahora?' }
    FileResponse:
      type: object
      required: [id, originalName, contentType, sizeBytes, sha256, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        uploadedAt: { type: string, format: date-time }
    FeeConcept:
      type: string
      enum: [ENROLLMENT, MONTHLY, OTHER]
    CreateFeeRequest:
      type: object
      properties:
        seasonId: { type: string, format: uuid }
        concept: { $ref: '#/components/schemas/FeeConcept' }
        name: { type: string, maxLength: 120 }
        amount: { type: number, multipleOf: 0.01 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
    FeeResponse:
      type: object
      required: [id, seasonId, concept, name, amount, currency, validFrom, active]
      properties:
        id: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        concept: { $ref: '#/components/schemas/FeeConcept' }
        name: { type: string }
        amount: { type: number, multipleOf: 0.01 }
        currency: { type: string, example: COP }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        active: { type: boolean }
    StartRegistrationRequest:
      type: object
      properties:
        feeId: { type: string, format: uuid, description: Tarifa de concepto ENROLLMENT. }
        dueDate: { type: string, format: date }
    RegistrationResponse:
      type: object
      required: [playerId, playerStatus]
      properties:
        playerId: { type: string, format: uuid }
        playerStatus: { $ref: '#/components/schemas/PlayerStatus' }
        chargeId: { type: string, format: uuid, description: Solo al iniciar la matrícula. }
    MonthlyBillingRequest:
      type: object
      properties:
        feeId: { type: string, format: uuid, description: Tarifa de concepto MONTHLY. }
        period: { type: string, format: date, description: Primer día del mes. }
        dueDate: { type: string, format: date }
    MonthlyBillingResponse:
      type: object
      required: [players, created]
      properties:
        players: { type: integer }
        created: { type: integer }
    RecordPaymentRequest:
      type: object
      properties:
        chargeId: { type: string, format: uuid }
        amount: { type: number, multipleOf: 0.01 }
        method: { type: string, enum: [CASH, TRANSFER, CARD, OTHER] }
        reference: { type: string, maxLength: 100 }
        paidAt: { type: string, format: date-time }
        receiptFileId: { type: string, format: uuid }
    VoidPaymentRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    ChargeResponse:
      type: object
      required: [id, feeId, feeName, concept, dueDate, amount, adjusted, netAmount, applied, outstanding, status]
      properties:
        id: { type: string, format: uuid }
        feeId: { type: string, format: uuid }
        feeName: { type: string }
        concept: { $ref: '#/components/schemas/FeeConcept' }
        period: { type: string, format: date }
        dueDate: { type: string, format: date }
        amount: { type: number, multipleOf: 0.01 }
        adjusted: { type: number, multipleOf: 0.01 }
        netAmount: { type: number, multipleOf: 0.01 }
        applied: { type: number, multipleOf: 0.01 }
        outstanding: { type: number, multipleOf: 0.01 }
        status: { type: string, enum: [PENDING, PARTIAL, SETTLED, VOIDED] }
    PaymentResponse:
      type: object
      required: [id, playerId, chargeId, amount, netAmount, method, paidAt, voided]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        amount: { type: number, multipleOf: 0.01 }
        netAmount: { type: number, multipleOf: 0.01 }
        method: { type: string }
        reference: { type: string }
        paidAt: { type: string, format: date-time }
        receiptFileId: { type: string, format: uuid }
        voided: { type: boolean }
    AccountResponse:
      type: object
      required: [playerId, charged, paid, balance, charges, payments]
      properties:
        playerId: { type: string, format: uuid }
        charged: { type: number, multipleOf: 0.01 }
        paid: { type: number, multipleOf: 0.01 }
        balance: { type: number, multipleOf: 0.01 }
        charges: { type: array, items: { $ref: '#/components/schemas/ChargeResponse' } }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentResponse' } }
    CreateVenueRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 250 }
        reference: { type: string }
    VenueResponse:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        reference: { type: string }
        active: { type: boolean }
    ScheduleEventRequest:
      type: object
      properties:
        eventType: { type: string, enum: [TRAINING, EVALUATION] }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        headCoachId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        meetingAt: { type: string, format: date-time }
        meetingPoint: { type: string, maxLength: 200 }
        instructions: { type: string }
    CancelEventRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    RescheduleEventRequest:
      type: object
      properties:
        venueId: { type: string, format: uuid }
        headCoachId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        meetingAt: { type: string, format: date-time }
        meetingPoint: { type: string, maxLength: 200 }
        instructions: { type: string }
        reason: { type: string, maxLength: 2000 }
    ScheduleSeriesRequest:
      type: object
      properties:
        eventType: { type: string, enum: [TRAINING, EVALUATION] }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        headCoachId: { type: string, format: uuid }
        weekdays:
          type: array
          minItems: 1
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime: { type: string, example: '17:00', description: Hora local del club. }
        endTime: { type: string, example: '19:00', description: Hora local del club; posterior al inicio, el mismo día. }
        meetingPoint: { type: string, maxLength: 200 }
        instructions: { type: string }
    SeriesResponse:
      type: object
      required: [id, eventType, categoryId, venueId, weekdays, startDate, endDate, startTime, endTime, timeZone, occurrenceCount, events]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [TRAINING, EVALUATION] }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        headCoachId: { type: string, format: uuid }
        weekdays:
          type: array
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
