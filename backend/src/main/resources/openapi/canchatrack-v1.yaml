    SeasonMatchesResponse:
      type: object
      required: [played, wins, draws, losses, goalsFor, goalsAgainst]
      properties:
        played: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
    SeasonBillingResponse:
      type: object
      required: [charged, applied, outstanding, overdue]
      properties:
        charged: { type: number }
        applied: { type: number }
        outstanding: { type: number }
        overdue: { type: number, description: Saldo con vencimiento anterior a hoy (zona del club). }
    SeasonSummaryResponse:
      type: object
      required: [season, generatedAt, roster, events, attendance, matches, billing]
      properties:
        season: { $ref: '#/components/schemas/SeasonInfoResponse' }
        generatedAt: { type: string, format: date-time }
        roster:
          type: array
          items: { $ref: '#/components/schemas/SeasonRosterLineResponse' }
        events:
          type: array
          items: { $ref: '#/components/schemas/SeasonEventCountResponse' }
        attendance: { $ref: '#/components/schemas/SeasonAttendanceResponse' }
        matches: { $ref: '#/components/schemas/SeasonMatchesResponse' }
        billing: { $ref: '#/components/schemas/SeasonBillingResponse' }
    SeasonReportRequest:
      type: object
      required: [seasonId]
      properties:
        seasonId: { type: string, format: uuid }
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Obligatorio al regenerar un informe que ya tiene una versión; se ignora en la primera.
    SeasonReportResponse:
      type: object
      required: [id, playerId, seasonId, number, consecutive, version, verificationCode, templateVersion, fileId, fileHash, generatedAt]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        number: { type: string, example: IT-000012, description: 'Consecutivo visible, único y que no se reutiliza.' }
        consecutive: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
        previousReportId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        verificationCode: { type: string, example: ABCD-EFGH-JKLM }
        templateVersion: { type: string, example: plantilla-1 }
        fileId: { type: string, format: uuid, description: 'Se descarga con GET /files/{fileId}.' }
        fileHash: { type: string, description: 'SHA-256 hexadecimal del PDF.' }
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: [string, 'null'], format: uuid }
    SeasonReportVerificationResponse:
      type: object
      required: [current, report]
      properties:
        current: { type: boolean, description: 'Falso si existe una versión más reciente del informe.' }
        report: { $ref: '#/components/schemas/SeasonReportResponse' }
    SeasonClosureRequest:
      type: object
      required: [seasonId, reportId]
      properties:
        seasonId: { type: string, format: uuid }
        reportId: { type: string, format: uuid, description: 'Debe ser la versión más reciente del informe del jugador y la temporada.' }
    SeasonReopenRequest:
      type: object
      required: [reason, detail, confirmation]
      properties:
        reason: { type: string, maxLength: 500 }
        detail: { type: string, maxLength: 2000 }
        confirmation: { type: string, description: 'Código del jugador (por ejemplo JG-000012), sin importar mayúsculas.' }
    SeasonClosureResponse:
      type: object
      required: [id, playerId, seasonId, reportId, closedBy, closedAt, open]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        reportId: { type: string, format: uuid }
        closedBy: { type: string, format: uuid }
        closedAt: { type: string, format: date-time }
        open: { type: boolean, description: 'Verdadero mientras no se haya reabierto.' }
        reopenedBy: { type: [string, 'null'], format: uuid }
        reopenedAt: { type: [string, 'null'], format: date-time }
        reopenReason: { type: [string, 'null'] }
        reopenDetail: { type: [string, 'null'] }
  responses:
    BadRequest:
      description: Solicitud mal formada.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Falta autenticación válida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sin permiso efectivo (rol, vínculo con el jugador o estado). Código AUTH_FORBIDDEN.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: El recurso no existe (RESOURCE_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Datos inválidos (HTTP 422, código VALIDATION_FAILED) con la lista `errors` por campo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Conflict:
      description: Conflicto de estado, agenda, cupo o versión obsoleta (HTTP 409).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regla de negocio o validación incumplida (HTTP 422).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
security:
  - bearerAuth: []
