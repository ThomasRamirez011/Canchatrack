      properties:
        playerId: { type: string, format: uuid }
        charged: { type: number, multipleOf: 0.01 }
        paid: { type: number, multipleOf: 0.01 }
        balance: { type: number, multipleOf: 0.01 }
        charges: { type: array, items: { $ref: '#/components/schemas/ChargeResponse' } }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentResponse' } }
    CreateVenueRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 250 }
