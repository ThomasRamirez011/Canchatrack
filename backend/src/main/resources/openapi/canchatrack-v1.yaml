    CloseResponse:
      type: object
      required: [eventId, closedAt, autoAbsent, total]
      properties:
        eventId: { type: string, format: uuid }
        closedAt: { type: string, format: date-time }
        autoAbsent: { type: integer }
        total: { type: integer }
    CorrectionRequest:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
