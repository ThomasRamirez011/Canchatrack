        concept: { $ref: '#/components/schemas/FeeConcept' }
        period: { type: string, format: date }
        dueDate: { type: string, format: date }
        amount: { type: number, multipleOf: 0.01 }
        adjusted: { type: number, multipleOf: 0.01 }
        netAmount: { type: number, multipleOf: 0.01 }
        applied: { type: number, multipleOf: 0.01 }
        outstanding: { type: number, multipleOf: 0.01 }
        status: { type: string, enum: [PENDING, PARTIAL, SETTLED, VOIDED] }
    PaymentResponse:
      type: object
      required: [id, playerId, chargeId, amount, netAmount, method, paidAt, voided]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        amount: { type: number, multipleOf: 0.01 }
        netAmount: { type: number, multipleOf: 0.01 }
        method: { type: string }
        reference: { type: string }
        paidAt: { type: string, format: date-time }
        receiptFileId: { type: string, format: uuid }
        voided: { type: boolean }
    AccountResponse:
      type: object
