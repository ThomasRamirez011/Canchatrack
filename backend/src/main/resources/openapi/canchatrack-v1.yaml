        reason: { type: string, maxLength: 2000 }
    CorrectionResponse:
      type: object
      required: [recordId, playerId, status, excuseAccepted]
      properties:
        recordId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        excuseAccepted: { type: boolean }
    SummaryResponse:
      type: object
      required: [playerId, sessions, present, late, excused, acceptedExcuses, absent]
      properties:
        playerId: { type: string, format: uuid }
        sessions: { type: integer }
        present: { type: integer }
        late: { type: integer }
        excused: { type: integer }
        acceptedExcuses: { type: integer }
        absent: { type: integer }
        percentage: { type: [number, 'null'], description: Con un decimal; nulo si no hay sesiones que contar. }
    PlayerStatus:
      type: string
      description: Estados del expediente (DAD 3.2).
      enum: [SUBMITTED, COMMITTEE_PENDING, CATEGORY_ASSIGNED, PENDING_REGISTRATION, ACTIVE, IN_EVALUATION,
             PROMOTION_APPROVED, SUSPENDED, WITHDRAWN, SEASON_CLOSED, REJECTED]
    EnrollmentPlayer:
      type: object
      required: [firstName, lastName, documentType, documentNumber, birthDate]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        documentType: { type: string, enum: [CC, CE, PA, TI, RC] }
        documentNumber: { type: string, minLength: 4, maxLength: 30 }
        birthDate: { type: string, format: date, description: No puede ser futura. }
    SubmitEnrollmentRequest:
      type: object
      required: [callId, player, acceptDataProcessing, acceptParticipation]
      properties:
        callId: { type: string, format: uuid }
        player: { $ref: '#/components/schemas/EnrollmentPlayer' }
        relationship: { type: string, maxLength: 40, examples: [Madre] }
        acceptDataProcessing: { type: boolean, description: Debe ser true (RF-011). }
        acceptParticipation: { type: boolean, description: Debe ser true (RF-011). }
    EnrollmentResponse:
      type: object
      required: [enrollmentId, filingCode, playerId, playerCode, playerStatus, callId, submittedAt, viaException]
      properties:
        enrollmentId: { type: string, format: uuid }
        filingCode: { type: string, examples: [RAD-000001] }
        playerId: { type: string, format: uuid }
        playerCode: { type: string, examples: [JG-000001] }
        playerStatus: { $ref: '#/components/schemas/PlayerStatus' }
        callId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        viaException: { type: boolean, description: true si se radicó con una habilitación excepcional. }
    PlayerSummaryResponse:
      type: object
      required: [id, code, firstName, lastName, birthDate, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        birthDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PlayerStatus' }
    PlayerPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlayerSummaryResponse' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    EnrollmentSummaryResponse:
      type: object
      required: [id, filingCode, callId, callName, submittedAt]
      properties:
        id: { type: string, format: uuid }
        filingCode: { type: string }
        callId: { type: string, format: uuid }
        callName: { type: string }
        submittedAt: { type: string, format: date-time }
    PlayerDetailResponse:
      type: object
      required: [id, code, firstName, lastName, documentType, documentNumber, birthDate, status, createdAt, enrollments]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        birthDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PlayerStatus' }
        createdAt: { type: string, format: date-time }
        enrollments:
          type: array
          items: { $ref: '#/components/schemas/EnrollmentSummaryResponse' }
    ValidationProblem:
      description: Problem con la lista de campos inválidos (VALIDATION_FAILED).
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    Problem:
      type: object
      description: Error según RFC 9457 (application/problem+json).
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: "urn:canchatrack:problem:<code>"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Mensaje seguro; nunca incluye datos clínicos, secretos ni detalles internos.
        code:
          type: string
          description: Código estable (DDS secc. 13). Los errores genéricos del framework usan HTTP_<estado>.
          examples: [CALLUP_NOT_ELIGIBLE]
        correlationId:
          type: string
      additionalProperties: true
    ErrorCode:
      type: string
      description: Catálogo cerrado de códigos de negocio. Sincronizado con shared.domain.ErrorCode (lo verifica OpenApiContractTest).
      enum:
          - AUTH_FORBIDDEN
          - PLAYER_STATE_CONFLICT
          - ENROLLMENT_CLOSED
          - CATEGORY_FULL
          - PANEL_INVALID
          - NEGATIVE_REASON_REQUIRED
          - ROUND_CLOSED
          - CALLUP_NOT_ELIGIBLE
          - SCHEDULE_CONFLICT
          - ATTENDANCE_SESSION_CLOSED
          - FILE_REJECTED
          - PAYMENT_IMMUTABLE
          - NOTIFICATION_DELIVERY_FAILED
          - REPORT_GENERATION_FAILED
          - AUTH_UNAUTHENTICATED
          - RESOURCE_NOT_FOUND
          - VALIDATION_FAILED
          - RESOURCE_STATE_CONFLICT
          - CONCURRENT_MODIFICATION
          - IDEMPOTENCY_KEY_REQUIRED
          - IDEMPOTENCY_KEY_REUSED
          - INTERNAL_ERROR
    OpenRoundRequest:
      type: object
      required: [periodStart, periodEnd, dueAt]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueAt: { type: string, format: date-time, description: Vencimiento de la ronda; debe ser futuro. }
    ChangePeriodRequest:
      type: object
      required: [periodStart, periodEnd, reason]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueAt: { type: string, format: date-time, description: Nuevo vencimiento; si se omite se conserva. }
        reason: { type: string, maxLength: 2000 }
    EvaluationVerdict:
      type: string
      enum: [FAVORABLE, FOLLOW_UP_REQUIRED, UNFAVORABLE]
    EvaluatorDecisionRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { $ref: '#/components/schemas/EvaluationVerdict' }
        justification: { type: string, maxLength: 2000, description: Obligatoria si el concepto no es favorable. }
        actions: { type: string, maxLength: 2000, description: Acciones concretas; obligatorias si el concepto no es favorable. }
        criteria:
          type: object
          maxProperties: 40
          additionalProperties: true
          description: Criterios de la rúbrica del club (pendiente P-06); estructura libre.
    EvaluatorDecisionResponse:
      type: object
      required: [id, roundId, evaluatorId, verdict, periodStart, periodEnd, current, decidedAt]
      properties:
        id: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        evaluatorId: { type: string, format: uuid }
        verdict: { $ref: '#/components/schemas/EvaluationVerdict' }
        justification: { type: string }
        actions: { type: string }
        criteria: { type: object, additionalProperties: true }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        current: { type: boolean, description: Verdadero si se emitió sobre el periodo vigente de la ronda. }
        decidedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CloseRoundRequest:
      type: object
      properties:
        followUpPlan: { type: string, maxLength: 2000, description: Obligatorio si la ronda no termina en ascenso. }
    RoundResponse:
      type: object
      required: [id, playerId, periodStart, periodEnd, status]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueAt: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, CLOSED] }
        result: { type: string, enum: [APPROVED, FOLLOW_UP], description: Solo en rondas cerradas. }
        followUpPlan: { type: string }
        closedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [PENDING, FOLLOW_UP, APPROVED]
          description: Vista previa de la unanimidad. Solo coordinador y comité, y solo con la ronda abierta.
        decisions:
          type: array
          description: Ausente en los listados.
          items: { $ref: '#/components/schemas/EvaluatorDecisionResponse' }
    PromoteRequest:
      type: object
      required: [headCoachId]
      properties:
        targetCategoryId: { type: string, format: uuid, description: Si se omite, la categoría siguiente de la actual. }
        headCoachId: { type: string, format: uuid }
    PromotionResponse:
      type: object
      required: [playerId, previousCategoryId, categoryId, categoryName, headCoachId]
      properties:
        playerId: { type: string, format: uuid }
        previousCategoryId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        headCoachId: { type: string, format: uuid }
    CreateTournamentRequest:
      type: object
      properties:
        seasonId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        rules: { type: string, maxLength: 2000, description: Reglamento del torneo. }
    TournamentResponse:
      type: object
      required: [id, seasonId, name]
      properties:
        id: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        rules: { type: string }
    ScheduleMatchRequest:
      type: object
      properties:
        tournamentId: { type: string, format: uuid, description: Sin torneo el partido es amistoso. }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        headCoachId: { type: string, format: uuid }
        opponent: { type: string, maxLength: 150 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        meetingAt: { type: string, format: date-time }
        meetingPoint: { type: string, maxLength: 200 }
        instructions: { type: string, maxLength: 2000 }
    CancelMatchRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    MatchResponse:
      type: object
      required: [id, eventId, categoryId, venueId, venueName, opponent, startAt, endAt, status]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        categoryId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        venueName: { type: string }
        headCoachId: { type: string, format: uuid }
        opponent: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        meetingAt: { type: string, format: date-time }
        meetingPoint: { type: string }
        instructions: { type: string }
        status: { type: string, enum: [CONFIRMED, CANCELLED, COMPLETED] }
        cancellationReason: { type: string }
        scoreFor: { type: integer, minimum: 0 }
        scoreAgainst: { type: integer, minimum: 0 }
        resultNotes: { type: string }
        resultRecordedAt: { type: string, format: date-time }
    CallupPlayersRequest:
      type: object
      properties:
        playerIds:
          type: array
          minItems: 1
          maxItems: 40
          items: { type: string, format: uuid }
    CallupStatus:
      type: string
      enum: [PROPOSED, CONFIRMED, NOT_ELIGIBLE, REMOVED]
    IneligibilityCause:
      type: string
      enum: [PLAYER_NOT_ACTIVE, MEDICAL_CERTIFICATE_INVALID, PARTICIPATION_AUTHORIZATION_INVALID, ARREARS_POLICY]
    CallupResponse:
      type: object
      required: [playerId, status, authorized]
      properties:
        playerId: { type: string, format: uuid }
        playerCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        status: { $ref: '#/components/schemas/CallupStatus' }
        ineligibilityCode: { $ref: '#/components/schemas/IneligibilityCause' }
        eligibility:
          type: object
          description: Cumplimiento de cada requisito al evaluar. Solo personal; nunca contiene datos de salud.
          properties:
            active: { type: boolean }
            medicalCertificate: { type: boolean }
            participationAuthorization: { type: boolean }
            arrearsClear: { type: boolean }
        proposedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        authorized: { type: boolean, description: El acudiente ya autorizó este partido. }
        minutesPlayed: { type: integer, minimum: 0, maximum: 150 }
        goals: { type: integer, minimum: 0, maximum: 99 }
        observations: { type: string }
    MatchDetailResponse:
      type: object
      required: [match, callups]
      properties:
        match: { $ref: '#/components/schemas/MatchResponse' }
        callups:
          type: array
          items: { $ref: '#/components/schemas/CallupResponse' }
    PlayerResultRequest:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        minutesPlayed: { type: integer, minimum: 0, maximum: 150 }
        goals: { type: integer, minimum: 0, maximum: 99 }
        observations: { type: string, maxLength: 1000 }
    MatchResultRequest:
      type: object
      properties:
        scoreFor: { type: integer, minimum: 0, maximum: 99 }
        scoreAgainst: { type: integer, minimum: 0, maximum: 99 }
        resultNotes: { type: string, maxLength: 2000 }
        reason: { type: string, maxLength: 2000, description: Obligatorio al corregir un resultado ya registrado. }
        players:
          type: array
          items: { $ref: '#/components/schemas/PlayerResultRequest' }
    MatchAuthorizationResponse:
      type: object
      required: [matchId, playerId, recordedNow]
      properties:
        matchId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        recordedNow: { type: boolean, description: false si la autorización ya existía. }
    PlayerMatchResponse:
      type: object
      required: [matchId, opponent, startAt, matchStatus, authorized]
      properties:
        matchId: { type: string, format: uuid }
        opponent: { type: string }
        tournamentName: { type: string }
        startAt: { type: string, format: date-time }
        matchStatus: { type: string, enum: [CONFIRMED, CANCELLED, COMPLETED] }
        authorized: { type: boolean }
        minutesPlayed: { type: integer }
        goals: { type: integer }
        scoreFor: { type: integer }
        scoreAgainst: { type: integer }
  responses:
    BadRequest:
      description: Solicitud mal formada.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Falta autenticación válida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sin permiso efectivo (rol, vínculo con el jugador o estado). Código AUTH_FORBIDDEN.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: El recurso no existe (RESOURCE_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Datos inválidos (HTTP 422, código VALIDATION_FAILED) con la lista `errors` por campo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Conflict:
      description: Conflicto de estado, agenda, cupo o versión obsoleta (HTTP 409).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regla de negocio o validación incumplida (HTTP 422).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
security:
  - bearerAuth: []
