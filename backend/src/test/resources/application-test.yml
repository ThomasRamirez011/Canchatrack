# Perfil de pruebas de integración. La base de datos la aporta Testcontainers (@ServiceConnection),
# por eso no se define spring.datasource.* aquí.
spring:
  jpa:
    show-sql: false

canchatrack:
  files:
    directory: ${java.io.tmpdir}/canchatrack-test-files
  security:
    jwt:
      secret: G8vny3gToStxavTB+wo9OQx++bZyXmGriJlxuZtG8OlLkqQYDAai+X3fJDc+ZgC7 # solo pruebas
    cors:
      allowed-origins: https://app.canchatrack.test
  notifications:
    processor:
      enabled: false # las pruebas invocan al procesador a mano; sin tareas periódicas en segundo plano
  documents:
    alerts:
      enabled: false # las pruebas invocan las alertas de vencimiento a mano
  payments:
    arrears-notices:
      enabled: false # las pruebas invocan los avisos de mora a mano
  scheduling:
    reminders:
      enabled: false # las pruebas invocan los recordatorios a mano
  identity:
    bcrypt-strength: 4 # mínimo de BCrypt: acelera las pruebas, no es un valor de producción
    require-verified-email: false # AccountSecurityIT lo activa; el resto de pruebas registra acudientes y entra de inmediato
    mfa:
      enabled: false # MfaIT lo activa
      encryption-key: dGVzdC1vbmx5LW1mYS1rZXktMzItYnl0ZXMtISEhISE= # llave de pruebas (32 bytes)
    rate-limit:
      enabled: false # todas las pruebas comparten la IP de MockMvc; AccountSecurityIT lo activa
    maintenance:
      enabled: false # las pruebas invocan la limpieza a mano

logging:
  level:
    root: WARN
    co.edu.unipamplona.canchatrack: INFO
